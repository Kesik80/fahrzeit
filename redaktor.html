// ── participantOrders ──────────────────
function renderOrders(box) {
  const drivers = Object.keys(data.defaultCoords);

  const row = document.createElement('div');
  row.className = 'driver-row';
  const driverSel = document.createElement('select');
  driverSel.id = 'driverSel';
  [...drivers].sort(collator.compare).forEach(d => {
    const opt = document.createElement('option');
    opt.value = opt.textContent = d;
    if (d === (participantOrders._lastDriver || drivers[0])) opt.selected = true;
    driverSel.appendChild(opt);
  });
  row.appendChild(driverSel);

  const addPassBtn = document.createElement('button');
  addPassBtn.className = 'add-sub-btn';
  addPassBtn.textContent = '+';
  addPassBtn.title = 'Добавить попутчика со старта';
  addPassBtn.style.cssText = 'width:32px;height:32px;border-radius:50%;flex-shrink:0;font-size:1.2rem;margin-left:auto;';
  addPassBtn.onclick = () => {
    const driver = driverSel.value;
    const current = startPassengers[driver] || [];
    const avail = Object.keys(data.defaultCoords).filter(n => n !== driver && !current.includes(n));
    if (!avail.length) { showMsg('Все уже добавлены'); return; }
    bsOpen({
      title: `Попутчик ${driver} со старта`,
      items: avail,
      mode: 'participant',
      onSelect(name) {
        snapshot('попутчик');
        if (!startPassengers[driver]) startPassengers[driver] = [];
        startPassengers[driver].push(name);
        rebuildPassengers(); updateRaw(); markDirty(); showMsg('Попутчик добавлен ✓');
      }
    });
  };
  row.appendChild(addPassBtn);
  box.appendChild(row);

  // ── Попутчики стартовой точки водителя ──
  const passWrap = document.createElement('div');
  passWrap.id = 'passWrap';

  function rebuildPassengers() {
    const driver = driverSel.value;
    passWrap.innerHTML = '';
    const plist = startPassengers[driver] || [];
    plist.forEach((name, pi) => {
      const sd = document.createElement('div');
      sd.className = 'card sub-card passenger-card';
      sd.style.marginBottom = '4px';
      const arrow = document.createElement('span');
      arrow.textContent = '↳';
      arrow.style.cssText = 'color:var(--text2);font-size:.8rem;flex-shrink:0;';
      const nm = document.createElement('span');
      nm.className = 'card-name'; nm.style.cursor = 'default'; nm.textContent = name;
      sd.appendChild(arrow); sd.appendChild(nm);
      sd.appendChild(mkDelBtn(() => {
        snapshot('удаление попутчика');
        startPassengers[driver].splice(pi, 1);
        if (!startPassengers[driver].length) delete startPassengers[driver];
        rebuildPassengers(); updateRaw();
      }));
      passWrap.appendChild(sd);
    });
    passWrap.style.marginBottom = plist.length ? '8px' : '0';
  }
  rebuildPassengers();
  box.appendChild(passWrap);

  const listBox = document.createElement('div');
  listBox.id = 'orderList';
  box.appendChild(listBox);

  function rebuildList() {
    const driver = driverSel.value;
    participantOrders._lastDriver = driver;
    listBox.innerHTML = '';
    const order = participantOrders[driver] || [];

    if (!order.length) {
      listBox.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><p>Порядок не задан.<br>Нажмите + чтобы добавить.</p></div>`;
      updateRaw();
      return;
    }

    order.forEach((item, idx) => {
      if (typeof item === 'string') {
        const div = mkCard(false, idx);
        const nm = document.createElement('span'); nm.className = 'card-name'; nm.style.cursor = 'default';
        nm.textContent = `${idx + 1}. ${item}`; div.appendChild(nm);
        const subBtn = mkAddSubBtn();
        subBtn.onclick = e => { e.stopPropagation(); triggerConvertToGroup(driver, idx, item); };
        div.appendChild(subBtn);
        div.appendChild(mkHandle());
        div.appendChild(mkDelBtn(() => { snapshot('удаление'); order.splice(idx, 1); rebuildList(); showMsg('Удалено'); }));
        listBox.appendChild(div);
      } else if (item?.treffpunkt) {
        const div = mkCard(false, idx);
        const nm = document.createElement('span'); nm.className = 'card-name'; nm.style.cursor = 'default';
        nm.textContent = `${idx + 1}. 📍 ${item.treffpunkt}`; div.appendChild(nm);
        const subBtn = mkAddSubBtn();
        subBtn.title = 'Добавить кто ждёт здесь';
        subBtn.onclick = e => { e.stopPropagation(); triggerAddTreffPerson(driver, idx, item.treffpunkt); };
        div.appendChild(subBtn);
        div.appendChild(mkHandle());
        div.appendChild(mkDelBtn(() => { snapshot('удаление'); order.splice(idx, 1); rebuildList(); showMsg('Удалено'); }));
        listBox.appendChild(div);
        if (item.persons?.length) {
          const indent = document.createElement('div'); indent.className = 'group-indent';
          item.persons.forEach((person, pi) => {
            const sd = mkCard(false, idx);
            sd.classList.add('sub-card');
            const arrow = document.createElement('span'); arrow.textContent = '↳'; arrow.style.cssText = 'color:var(--text2);font-size:.8rem;flex-shrink:0;';
            const nm2 = document.createElement('span'); nm2.className = 'card-name'; nm2.style.cursor = 'default'; nm2.textContent = person;
            sd.appendChild(arrow); sd.appendChild(nm2);
            sd.appendChild(mkDelBtn(() => { snapshot('удаление'); item.persons.splice(pi, 1); rebuildList(); showMsg('Удалено'); }));
            indent.appendChild(sd);
          });
          listBox.appendChild(indent);
        }
      } else if (item?.main) {
        const div = mkCard(true, idx);
        const nm = document.createElement('span'); nm.className = 'card-name'; nm.style.cursor = 'default';
        nm.textContent = `${idx + 1}. ${item.main} 👥`; div.appendChild(nm);
        const subBtn = mkAddSubBtn();
        subBtn.onclick = e => { e.stopPropagation(); triggerAddToGroup(driver, idx, item.main); };
        div.appendChild(subBtn);
        div.appendChild(mkHandle());
        div.appendChild(mkDelBtn(() => { snapshot('удаление'); order.splice(idx, 1); rebuildList(); showMsg('Удалено'); }));
        listBox.appendChild(div);

        if (item.subParticipants?.length) {
          const indent = document.createElement('div'); indent.className = 'group-indent';
          item.subParticipants.forEach((sub, si) => {
            const sd = mkCard(false, idx);
            sd.classList.add('sub-card');
            const arrow = document.createElement('span'); arrow.textContent = '↳'; arrow.style.cssText = 'color:var(--text2);font-size:.8rem;flex-shrink:0;';
            const nm2 = document.createElement('span'); nm2.className = 'card-name'; nm2.style.cursor = 'default'; nm2.textContent = sub;
            sd.appendChild(arrow); sd.appendChild(nm2);
            sd.appendChild(mkDelBtn(() => {
              snapshot('удаление');
              item.subParticipants.splice(si, 1);
              if (!item.subParticipants.length) order[idx] = item.main;
              rebuildList(); showMsg('Удалено');
            }));
            indent.appendChild(sd);
          });
          listBox.appendChild(indent);
        }
      }
    });

    if (listBox._sortable) listBox._sortable.destroy();
    listBox._sortable = new Sortable(listBox, {
      animation: 150,
      handle: '.drag-handle',
      filter: '.group-indent',
      onEnd: () => {
        snapshot('перестановка');
        const cards = [...listBox.children].filter(el => el.classList.contains('card'));
        participantOrders[driver] = cards.map(c => order[parseInt(c.dataset.index)]);
        rebuildList(); showMsg('Порядок изменён'); markDirty();
      }
    });

    updateRaw();
  }

  driverSel.onchange = () => { rebuildList(); rebuildPassengers(); };
  rebuildList();

  appendRawBlock(box);
  updateRaw();
}

// ── Вкладка «Проверка» ─────────────────
function renderHealthcheck(box) {
  const issues = collectIssues();
  const okCount = issues.filter(i => i.items.length === 0).length;

  const head = document.createElement('div');
  head.className = 'hc-group ' + (issues.some(i => i.level === 'err' && i.items.length) ? 'err'
                : issues.some(i => i.items.length) ? 'warn' : 'ok');
  head.innerHTML = `<div class="hc-title">🩺 Проверка данных</div>
    <div class="hc-desc">Проверок пройдено: <b>${okCount} из ${issues.length}</b>.
    Здесь показаны только логические проблемы файла — на работу редактора они не влияют,
    но могут сломать расчёт на главной странице.</div>`;
  box.appendChild(head);

  issues.forEach(iss => {
    const g = document.createElement('div');
    g.className = 'hc-group ' + (iss.items.length ? iss.level : 'ok');
    const title = document.createElement('div');
    title.className = 'hc-title';
    title.innerHTML = `${iss.items.length ? (iss.level === 'err' ? '❌' : '⚠️') : '✅'} ${iss.title}
      <span class="section-count">${iss.items.length}</span>`;
    g.appendChild(title);

    const desc = document.createElement('div');
    desc.className = 'hc-desc';
    desc.textContent = iss.desc;
    g.appendChild(desc);

    if (iss.items.length) {
      const ul = document.createElement('div');
      ul.className = 'hc-items';
      ul.textContent = iss.items.slice(0, 60).join(' · ') + (iss.items.length > 60 ? ' …' : '');
      g.appendChild(ul);

      if (iss.fix) {
        const fb = document.createElement('button');
        fb.className = 'hc-fix';
        fb.textContent = iss.fixLabel || '🔧 Исправить';
        fb.onclick = () => {
          snapshot(iss.title);
          const n = iss.fix();
          markDirty(); updateHeaderSub(); render();
          showMsg(`Исправлено: ${n}`);
        };
        g.appendChild(fb);
      }
    }
    box.appendChild(g);
  });
}

function collectIssues() {
  const partNames = Object.keys(data.defaultCoords);
  const allNames  = new Set([...partNames, ...Object.keys(data.stations)]);
  const treffNames = new Set(Object.keys(treffpunkt));
  const out = [];

  // 1. Пустые / нулевые координаты
  const badCoords = [];
  COORD_GROUPS.forEach(g => Object.entries(groupObj(g)).forEach(([n, c]) => {
    if (!coordValid(c)) badCoords.push(`${n} (${g})`);
  }));
  out.push({
    level: 'err', title: 'Записи без координат', items: badCoords,
    desc: 'Координаты 0,0 или пустые. Такие точки главная страница не сможет построить в маршруте.'
  });

  // 2. Не 6 знаков после запятой
  const wrongDp = [];
  COORD_GROUPS.forEach(g => Object.entries(groupObj(g)).forEach(([n, c]) => {
    if (c && (roundCoord(c.lat) !== c.lat || roundCoord(c.lng) !== c.lng)) wrongDp.push(`${n} (${g})`);
  }));
  out.push({
    level: 'warn', title: 'Координаты не округлены до 6 знаков', items: [...new Set(wrongDp)],
    desc: '6 знаков — это примерно 11 см. Лишние знаки — мусор от Google, меньше — потеря точности.',
    fixLabel: '📐 Округлить все до 6 знаков',
    fix: () => normalizeAllCoords()
  });

  // 3. Дубли координат
  const seen = {}, dupes = [];
  COORD_GROUPS.forEach(g => Object.entries(groupObj(g)).forEach(([n, c]) => {
    if (!coordValid(c)) return;
    const k = `${fmtCoord(c.lat)},${fmtCoord(c.lng)}`;
    if (seen[k]) dupes.push(`${seen[k]} = ${n}`); else seen[k] = n;
  }));
  out.push({
    level: 'warn', title: 'Одинаковые координаты у разных записей', items: dupes,
    desc: 'Две точки в одном месте. Обычно это нормально (сосед/станция), но иногда — опечатка.'
  });

  // 4. Времена, ссылающиеся на несуществующие имена
  const orphanTT = Object.keys(travelTimes).filter(k => {
    const [a, b] = splitPairKey(k, false);
    return !allNames.has(a) || !allNames.has(b);
  });
  out.push({
    level: 'err', title: 'travelTimes без владельца', items: orphanTT,
    desc: 'Ключи вида «Имя1-Имя2», где хотя бы одного имени больше нет в участниках/станциях.',
    fixLabel: '🧹 Удалить лишние ключи',
    fix: () => { orphanTT.forEach(k => delete travelTimes[k]); return orphanTT.length; }
  });

  const orphanTreff = Object.keys(trefftravelTimes).filter(k => {
    const [a, b] = splitPairKey(k, true);
    return !treffNames.has(a) || !allNames.has(b);
  });
  out.push({
    level: 'err', title: 'trefftravelTimes без владельца', items: orphanTreff,
    desc: 'Ключи, где Treffpunkt или участник больше не существуют.',
    fixLabel: '🧹 Удалить лишние ключи',
    fix: () => { orphanTreff.forEach(k => delete trefftravelTimes[k]); return orphanTreff.length; }
  });

  // 5. Недостающие пары Treffpunkt → участник
  const missingTreff = [];
  Object.keys(treffpunkt).forEach(t => partNames.forEach(p => {
    if (trefftravelTimes[`${t}-${p}`] === undefined) missingTreff.push(`${t}-${p}`);
  }));
  out.push({
    level: 'warn', title: 'Не хватает пар Treffpunkt → участник', items: missingTreff,
    desc: 'Для каждого места встречи нужна строка времени до каждого участника.',
    fixLabel: '➕ Создать недостающие (5 мин)',
    fix: () => { missingTreff.forEach(k => trefftravelTimes[k] = DEFAULT_TT); return missingTreff.length; }
  });

  // 6. Порядок остановок ссылается на удалённых людей
  const orphanOrder = [];
  Object.keys(participantOrders).filter(k => !k.startsWith('_')).forEach(driver => {
    if (!allNames.has(driver)) orphanOrder.push(`водитель ${driver}`);
    (participantOrders[driver] || []).forEach(item => {
      if (typeof item === 'string') { if (!allNames.has(item)) orphanOrder.push(`${driver} → ${item}`); }
      else if (item?.main) {
        if (!allNames.has(item.main)) orphanOrder.push(`${driver} → ${item.main}`);
        (item.subParticipants || []).forEach(s => { if (!allNames.has(s)) orphanOrder.push(`${driver} → ${s}`); });
      } else if (item?.treffpunkt) {
        if (!treffNames.has(item.treffpunkt)) orphanOrder.push(`${driver} → 📍${item.treffpunkt}`);
        (item.persons || []).forEach(s => { if (!allNames.has(s)) orphanOrder.push(`${driver} → ${s}`); });
      }
    });
  });
  out.push({
    level: 'err', title: 'Порядок ссылается на несуществующих', items: orphanOrder,
    desc: 'В списке остановок остались имена, которых уже нет в участниках.',
    fixLabel: '🧹 Почистить порядок',
    fix: () => {
      let n = 0;
      Object.keys(participantOrders).filter(k => !k.startsWith('_')).forEach(driver => {
        if (!allNames.has(driver)) { delete participantOrders[driver]; n++; return; }
        let list = (participantOrders[driver] || []).filter(item => {
          if (typeof item === 'string') return allNames.has(item);
          if (item?.main) return allNames.has(item.main);
          if (item?.treffpunkt) return treffNames.has(item.treffpunkt);
          return false;
        });
        list.forEach(item => {
          if (item?.main) item.subParticipants = (item.subParticipants || []).filter(s => allNames.has(s));
          else if (item?.treffpunkt) item.persons = (item.persons || []).filter(s => allNames.has(s));
        });
        n += (participantOrders[driver] || []).length - list.length;
        participantOrders[driver] = list;
      });
      Object.keys(startPassengers).forEach(d => {
        startPassengers[d] = startPassengers[d].filter(s => allNames.has(s));
        if (!startPassengers[d].length || !allNames.has(d)) delete startPassengers[d];
      });
      return n;
    }
  });

  // 7. Времена, которые никогда не считались
  const notCalced = Object.keys(travelTimes).filter(k => travelTimes[k] === DEFAULT_TT)
    .concat(Object.keys(trefftravelTimes).filter(k => trefftravelTimes[k] === DEFAULT_TT));
  out.push({
    level: 'warn', title: 'Время осталось значением по умолчанию (5 мин)', items: notCalced,
    desc: 'Эти пары ни разу не считались через Google. Кнопка 🔄 в панели снизу пересчитает их пачкой.'
  });

  // 8. Участники без своего порядка остановок
  const noOrder = partNames.filter(p => !participantOrders[p] || !participantOrders[p].length);
  out.push({
    level: 'warn', title: 'Участники без списка остановок', items: noOrder,
    desc: 'Если такой человек станет водителем, у него будет пустой маршрут по умолчанию.'
  });

  return out;
}

// ═══════════════════════════════════════
//  SORTABLE (перетаскивание карточек)
// ═══════════════════════════════════════
function makeSortable(listEl, onDone) {
  if (!listEl || !listEl.children.length) return;
  if (listEl._sortable) listEl._sortable.destroy();
  // Во время поиска часть карточек скрыта — перетаскивание дало бы неверный порядок
  const filtering = !!searchInput.value.trim();
  listEl._sortable = new Sortable(listEl, {
    animation: 150,
    handle: '.drag-handle',
    disabled: filtering,
    onEnd: evt => { if (evt.oldIndex !== evt.newIndex) onDone(); }
  });
  if (filtering) {
    listEl.querySelectorAll('.drag-handle').forEach(h => {
      h.style.opacity = '.15';
      h.title = 'Перетаскивание отключено, пока активен поиск';
    });
  }
}

// ═══════════════════════════════════════
//  DOM HELPERS
// ═══════════════════════════════════════
// Ширина текста в пикселях — чтобы поле подросло ровно на недостающее,
// а не разворачивалось на всю карточку.
function measureText(text, el) {
  try {
    const cs = getComputedStyle(el);
    const cv = measureText._c || (measureText._c = document.createElement('canvas'));
    const ctx = cv.getContext('2d');
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const w = ctx.measureText(text || '').width;
    if (w > 0) return w;
  } catch {}
  // Запасная оценка, если canvas недоступен
  const size = parseFloat(getComputedStyle(el).fontSize) || 16;
  return String(text || '').length * size * 0.58;
}

// Подгоняем ширину поля под содержимое.
// reserve — сколько пикселей карточки обязательно оставить соседу,
// чтобы он не схлопнулся в ноль.
function fitFieldWidth(el, text, reserve = 92) {
  const card = el.closest('.card');
  if (!card) return;
  const avail = card.clientWidth - reserve;
  if (avail <= 0) return;
  const need = Math.ceil(measureText(text, el)) + 34;   // + padding и курсор
  el.style.flex = `0 0 ${Math.max(70, Math.min(need, avail))}px`;
}
function resetFieldWidth(el) { el.style.flex = ''; }

function mkCard(isGroup, idx) {
  const d = document.createElement('div');
  d.className = 'card' + (isGroup ? ' group-card' : '');
  if (idx !== undefined) d.dataset.index = idx;
  return d;
}
function mkHandle() {
  const h = document.createElement('span');
  h.className = 'drag-handle'; h.textContent = '⠿';
  h.title = 'Перетащите, чтобы изменить порядок';
  return h;
}
function mkDelBtn(cb) {
  const b = document.createElement('button'); b.className = 'del-btn'; b.textContent = '✖';
  b.onclick = e => { e.stopPropagation(); cb(); markDirty(); };
  return b;
}
function mkAddSubBtn() {
  const b = document.createElement('button'); b.className = 'add-sub-btn'; b.textContent = '+';
  b.style.cssText = 'flex-shrink:0;'; return b;
}
function mkNameEl(name, onRename) {
  const span = document.createElement('span'); span.className = 'card-name'; span.textContent = name;
  span.onclick = () => {
    const card = span.closest('.card');
    const input = document.createElement('input'); input.className = 'card-name-input'; input.value = name;
    span.replaceWith(input);
    // Имя остаётся на своём месте слева и подрастает вправо ровно
    // настолько, сколько нужно тексту; координаты справа ужимаются
    card?.classList.add('name-editing');
    const fit = () => fitFieldWidth(input, input.value, 96);
    fit();
    input.addEventListener('input', fit);   // растёт по мере набора
    input.focus(); input.select();
    let done = false;
    const restore = () => { input.replaceWith(span); card?.classList.remove('name-editing'); };
    const finish = () => {
      if (done) return; done = true;
      const newName = input.value.trim();
      card?.classList.remove('name-editing');
      if (!newName || newName === name) { input.replaceWith(span); return; }
      if (!onRename(newName)) input.replaceWith(span);
    };
    input.addEventListener('blur', finish);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { done = true; restore(); }
    });
  };
  return span;
}
// Поле координат.
// В покое — короткая запись (4 знака), чтобы имя не обрезалось.
// При тапе поле разворачивается на всю карточку и показывает все 6 знаков.
// Понимает и цифры, и ссылки Google Maps.
function mkCoordInput(coord, onChange, opts = {}) {
  const wrap = document.createElement('div'); wrap.className = 'card-coord';
  wrap.style.marginLeft = 'auto';
  const inp = document.createElement('input'); inp.type = 'text';
  inp.inputMode = 'text';
  let cur = coord;                       // последнее сохранённое значение

  // Короткая запись: 4 знака ≈ 11 м — достаточно, чтобы различить точки
  const shortText = c => (!c || c.lat == null || c.lng == null)
    ? '' : `${Number(c.lat).toFixed(4)}, ${Number(c.lng).toFixed(4)}`;

  const card = () => wrap.closest('.card');
  function showShort() {
    inp.value = shortText(cur);
    inp.classList.add('short');
    inp.placeholder = opts.allowEmpty ? 'нет коорд.' : '51.5301, 6.8509';
  }
  function showFull() {
    inp.value = coordText(cur);
    inp.classList.remove('short');
    inp.placeholder = opts.allowEmpty ? 'нет координат' : '51.530133, 6.850858 или ссылка';
  }
  function refresh() {
    // если поле всё ещё в фокусе — оставляем полный вид
    (document.activeElement === inp) ? showFull() : showShort();
    inp.classList.toggle('bad', !opts.allowEmpty && !coordValid(cur));
  }

  showShort();
  inp.title = 'Координаты (6 знаков) или ссылка Google Maps\nНажмите, чтобы увидеть и изменить полностью';
  if (!opts.allowEmpty && !coordValid(coord)) inp.classList.add('bad');

  const fit = () => fitFieldWidth(wrap, inp.value || '51.530133, 6.850858', 104);
  inp.addEventListener('focus', () => {
    card()?.classList.add('coord-editing');
    showFull();
    fit();                                  // подрастает влево на недостающее
    // выделяем всё — проще вставить ссылку поверх
    setTimeout(() => inp.select(), 0);
  });
  inp.addEventListener('input', fit);       // вставили длинную ссылку — поле тянется
  inp.addEventListener('blur', () => {
    card()?.classList.remove('coord-editing');
    resetFieldWidth(wrap);                  // возвращаем узкую колонку
    showShort();
  });
  // Enter на телефоне закрывает клавиатуру и сворачивает поле
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });

  inp.addEventListener('change', async () => {
    const raw = inp.value.trim();
    if (!raw && opts.allowEmpty) {
      cur = { lat: null, lng: null };
      onChange(cur); refresh(); inp.classList.remove('approx');
      return;
    }
    const res = await parseAnyCoords(raw);
    if (res) {
      cur = normCoord(res);
      inp.classList.toggle('approx', res.approx === true);
      onChange(cur);
      showMsg(res.approx ? '⚠️ Взят центр карты — проверьте точку' : `Сохранено ✓ (${res.source || 'ручной ввод'})`, res.approx ? 3200 : 1800);
    }
    refresh();   // не распозналось — вернётся прежнее значение
  });

  wrap.appendChild(inp); return wrap;
}

// Кнопка «открыть точку в Google Maps» — быстрая визуальная проверка
function mkOpenMapBtn(getCoord) {
  const b = document.createElement('button');
  b.className = 'coord-open-btn';

let _bsCallback = null;

function bsOpen({ title, items = [], treffItems = [], mode = 'participant', onSelect, onAddNew, listLabel }) {
  bsClose();
  _bsCallback = { onSelect, onAddNew, mode, listLabel };

  const overlay = document.createElement('div');
  overlay.id = 'bsOverlay';
  overlay.className = 'bs-overlay show';
  overlay.addEventListener('click', e => { if (e.target === overlay) bsClose(); });

  const sheet = document.createElement('div');
  sheet.className = 'bs-sheet';

  const handle = document.createElement('div');
  handle.className = 'bs-handle';

  const header = document.createElement('div');
  header.className = 'bs-header';
  const titleEl = document.createElement('div');
  titleEl.className = 'bs-title';
  titleEl.textContent = title;
  header.appendChild(titleEl);

  if (mode === 'both') {
    const tabs = document.createElement('div');
    tabs.className = 'bs-tabs';
    ['participant', 'treff'].forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'bs-tab' + (tab === 'participant' ? ' active' : '');
      btn.dataset.tab = tab;
      btn.textContent = tab === 'participant' ? '👤 Коллега' : '📍 Treffpunkt';
      btn.onclick = () => bsSwitchTab(tab, items, treffItems, onSelect);
      tabs.appendChild(btn);
    });
    header.appendChild(tabs);
  }

  const divider = document.createElement('div');
  divider.className = 'bs-divider';

  const lbl = document.createElement('div');
  lbl.className = 'bs-list-label';
  lbl.id = 'bsListLabel';
  lbl.textContent = listLabel || (mode === 'treff' ? 'ВЫБЕРИТЕ МЕСТО ВСТРЕЧИ' : 'ВЫБЕРИТЕ УЧАСТНИКА');

  const list = document.createElement('div');
  list.className = 'bs-list';
  list.id = 'bsList';

  const footer = document.createElement('div');
  footer.className = 'bs-footer';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'bs-btn-cancel';
  cancelBtn.textContent = 'Отмена';
  cancelBtn.onclick = bsClose;
  footer.appendChild(cancelBtn);

  sheet.appendChild(handle); sheet.appendChild(header); sheet.appendChild(divider);
  sheet.appendChild(lbl); sheet.appendChild(list); sheet.appendChild(footer);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  bsRenderList(mode === 'treff' ? 'treff' : 'participant', items, treffItems, onSelect, onAddNew);
}

function bsSwitchTab(tab, items, treffItems, onSelect) {
  document.querySelectorAll('#bsOverlay .bs-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  bsRenderList(tab, items, treffItems, onSelect, _bsCallback ? _bsCallback.onAddNew : null);
}

function bsRenderList(tab, items, treffItems, onSelect, onAddNew) {
  const list = document.getElementById('bsList');
  const label = document.getElementById('bsListLabel');
  if (!list) return;
  list.innerHTML = '';

  const isParticipant = tab === 'participant';
  const custom = _bsCallback && _bsCallback.listLabel;
  if (label && !custom) label.textContent = isParticipant ? 'ВЫБЕРИТЕ УЧАСТНИКА' : 'ВЫБЕРИТЕ МЕСТО ВСТРЕЧИ';

  const names = isParticipant ? items : treffItems;
  names.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'bs-list-item';
    btn.textContent = name;
    btn.onclick = () => { bsClose(); onSelect(name, tab); };
    list.appendChild(btn);
  });

  if (!names.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:20px 24px;color:var(--text2);font-size:.9em;';
    empty.textContent = isParticipant ? 'Нет доступных участников' : 'Нет доступных мест встречи';
    list.appendChild(empty);
  }

  if (onAddNew) {
    const addBtn = document.createElement('button');
    addBtn.className = 'bs-list-item bs-add-new';
    addBtn.textContent = isParticipant ? '＋ Neue Person…' : '＋ Neuer Treffpunkt…';
    addBtn.onclick = () => { bsClose(); onAddNew(tab); };
    list.appendChild(addBtn);
  }
}

function bsClose() {
  const ov = document.getElementById('bsOverlay');
  if (ov) ov.remove();
  _bsCallback = null;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('bsOverlay')) bsClose();
});

function getUsedByDriver(driver) {
  const used = new Set();
  used.add(driver);
  (participantOrders[driver] || []).forEach(item => {
    if (typeof item === 'string') used.add(item);
    else if (item?.main) { used.add(item.main); (item.subParticipants || []).forEach(s => used.add(s)); }
    else if (item?.treffpunkt) { (item.persons || []).forEach(s => used.add(s)); }
  });
  (startPassengers[driver] || []).forEach(s => used.add(s));
  return used;
}
function getAllNames() {
  return Object.keys(data.defaultCoords || {}).sort(collator.compare);
}

function triggerAddOrder(driver) {
  const used = getUsedByDriver(driver);
  const avail = getAllNames().filter(n => !used.has(n));
  const treffKeys = Object.keys(treffpunkt);
  const hasTreff = treffKeys.length > 0;
  if (!avail.length && !hasTreff) { showMsg('Все участники уже добавлены'); return; }

  const mode = avail.length && hasTreff ? 'both' : avail.length ? 'participant' : 'treff';

  bsOpen({
    title: `Добавить к ${driver}`,
    items: avail, treffItems: treffKeys, mode,
    onAddNew(tab) {
      const sel = document.getElementById('modalGroupSel');
      sel.value = tab === 'treff' ? 'treffpunkt' : 'defaultCoords';
      updateAddPlaceholders();
      openModal('addModal');
    },
    onSelect(name, tab) {
      snapshot('добавление в порядок');
      if (!participantOrders[driver]) participantOrders[driver] = [];
      if (tab === 'treff') {
        participantOrders[driver].push({ treffpunkt: name, persons: [] });
        showMsg('Место встречи добавлено ✓');
      } else {
        participantOrders[driver].push(name);
        showMsg('Добавлено ✓');
      }
      participantOrders._lastDriver = driver;
      render(); markDirty();
    }
  });
}

function triggerConvertToGroup(driver, idx, mainName) {
  const avail = getAllNames().filter(n => !getUsedByDriver(driver).has(n));
  if (!avail.length) { showMsg('Нет доступных участников'); return; }
  bsOpen({
    title: `Добавить к ${mainName}`, items: avail, mode: 'participant',
    onSelect(name) {
      snapshot('группировка');
      participantOrders[driver][idx] = { main: mainName, subParticipants: [name] };
      render(); markDirty(); showMsg('Добавлено ✓');
    }
  });
}

function triggerAddToGroup(driver, groupIdx, groupMain) {
  const avail = getAllNames().filter(n => !getUsedByDriver(driver).has(n));
  if (!avail.length) { showMsg('Нет доступных участников'); return; }
  bsOpen({
    title: `Добавить в группу ${groupMain}`, items: avail, mode: 'participant',
    onSelect(name) {
      snapshot('добавление в группу');
      const g = participantOrders[driver][groupIdx];
      if (g?.subParticipants) g.subParticipants.push(name);
      render(); markDirty(); showMsg('Добавлено ✓');
    }
  });
}

function triggerAddTreffPerson(driver, treffIdx, treffName) {
  const avail = getAllNames().filter(n => !getUsedByDriver(driver).has(n));
  if (!avail.length) { showMsg('Нет доступных участников'); return; }
  bsOpen({
    title: `Кто ждёт у ${treffName}`, items: avail, mode: 'participant',
    onSelect(name) {
      snapshot('добавление к Treffpunkt');
      const t = participantOrders[driver][treffIdx];
      if (t) t.persons = [...(t.persons || []), name];
      render(); markDirty(); showMsg('Добавлено ✓');
    }
  });
}

document.getElementById('addConfirm').onclick = async () => {

  const name = document.getElementById('newName').value.trim();
  const val  = document.getElementById('newCoord').value.trim();
  if (!name) { showMsg('Введите название'); return; }

  try {

      snapshot('добавление');
      travelTimes[name] = parseInt(val) || DEFAULT_TT;
      autoCalcPair(name, false);
    } else if (grp === 'trefftravelTimes') {
      if (trefftravelTimes[name] !== undefined) { showMsg('Ключ уже есть'); return; }
      snapshot('добавление');
      trefftravelTimes[name] = parseInt(val) || DEFAULT_TT;
      autoCalcPair(name, true);
    } else if (grp === 'treffpunkt') {
      if (treffpunkt[name]) { showMsg('Пункт уже есть'); return; }
      const c = normCoord(await parseAnyCoords(val)) || { lat: 0, lng: 0 };
      snapshot('добавление');

      touchMeta('treffpunkt', name, true);
      addTreffLinks(name);
      Object.keys(data.defaultCoords).forEach(p => autoCalcPair(`${name}-${p}`, true));

document.getElementById('applyRaw').onclick = () => {
  const body = document.getElementById('rawBody');
  const toggleBtn = document.getElementById('rawToggle');
  if (!body) { showMsg('На этой вкладке нет JSON'); return; }
  if (!body.classList.contains('open')) {
    body.classList.add('open');
    toggleBtn && toggleBtn.classList.add('open');
    _rawWasOpen = true;
    showMsg('Откройте JSON, отредактируйте и нажмите Применить снова', 2600);
    return;
  }
  try {
    const el = document.getElementById('rawJson');
    const val = el.value.trim();
    if (!val) { showMsg('JSON пустой'); return; }
    const parsed = JSON.parse(val);
    const grp = currentGroup;
    snapshot('применение JSON');

    if (grp === 'participantOrders') {
      // Разбираем обратно объединённый формат {startPassengers, order}
      const orders = {}, sp = {};
      Object.keys(parsed).forEach(driver => {
        const v = parsed[driver];
        if (v && !Array.isArray(v) && v.order) {
          orders[driver] = v.order;
          if (v.startPassengers?.length) sp[driver] = v.startPassengers;
        } else orders[driver] = v;
      });
      const last = participantOrders._lastDriver;
      participantOrders = orders;
      if (last) participantOrders._lastDriver = last;
      startPassengers = sp;
    }
    else if (grp === 'greetings')    defaultGreetings = parsed;
    else if (grp === 'destinations') defaultMachineDestinations = parsed;
    else if (grp === 'farewell')     { farewellList = parsed.list || parsed; farewellText = parsed.text || farewellList[0]; }
    else setGroupObj(grp, parsed);

    if (COORD_GROUPS.includes(grp) || grp === 'destinations') normalizeAllCoords();
    updateHeaderSub(); markDirty(); render(); showMsg('Применено ✅');
  } catch(e) {
    showMsg('Ошибка JSON: ' + e.message.slice(0, 40) + ' ❌', 3000);
  }
};

document.getElementById('recalcStart').onclick = async () => {

  const pairs = [];

    });
  }
  if (target === 'trefftravelTimes' || target === 'both') {
    Object.keys(trefftravelTimes).forEach(key => {
      if (mode === 'missing' && trefftravelTimes[key] !== DEFAULT_TT) return;
      pairs.push({ key, src: trefftravelTimes, isTreff: true });
    });
  }

  if (!pairs.length) { prog.textContent = 'ℹ️ Нет пар для пересчёта'; return; }

  snapshot('массовый пересчёт');
  const startBtn = document.getElementById('recalcStart');
  startBtn.disabled = true;
  let done = 0, errors = 0;
  const failed = [];

  for (const { key, src, isTreff } of pairs) {
    prog.textContent = `⏳ ${done + errors + 1} / ${pairs.length}  —  ${key}`;
    try {
      const [a, b] = splitPairKey(key, isTreff);
      const cA = isTreff ? treffpunkt[a] : getCoordsFor(a);
      const cB = getCoordsFor(b);
      if (!coordValid(cA) || !coordValid(cB)) throw new Error(`нет координат: ${!coordValid(cA) ? a : b}`);
      src[key] = await fetchTravelTime(cA.lat, cA.lng, cB.lat, cB.lng);
      setAutoFlag(key, isTreff, true);
      done++;
    } catch(e) {
      errors++; failed.push(`${key} — ${e.message}`);
    }
    await new Promise(r => setTimeout(r, 300));
  }

  prog.textContent = `✅ Готово: обновлено ${done}, ошибок ${errors}`
    + (failed.length ? `\n\nНе удалось:\n${failed.slice(0, 10).join('\n')}` : '');
  prog.style.whiteSpace = 'pre-wrap';
  startBtn.disabled = false;
  markDirty(); render();
  showMsg(`Пересчитано ${done} пар`, 3000);
};

// ═══════════════════════════════════════
//  EXPORT
//  Ключи через JSON.stringify — имена с
//  апострофом (O'Brien) больше не ломают файл.
//  Координаты — строго 6 знаков.
// ═══════════════════════════════════════
function buildExportText() {
  const q = s => JSON.stringify(String(s));
  const coordLine = ([n, c]) => `  ${q(n)}: {lat: ${fmtCoord(c.lat)}, lng: ${fmtCoord(c.lng)}}`;
  const L = (o, fn) => Object.entries(o).map(fn).join(',\n');

  // Метаданные только для существующих записей — мусор не тащим
  const metaOut = {};
  COORD_GROUPS.forEach(g => {
    metaOut[g] = {};
    Object.keys(groupObj(g)).forEach(n => {
      const m = metaOf(g, n);
      if (m) metaOut[g][n] = m;
    });
  });

  return `// реестр имен
const defaultCoords = {
${L(data.defaultCoords, coordLine)}
};

// реестр станций
this.stations = {
${L(data.stations, coordLine)}
};

// Время в пути между участниками
this.travelTimes = {
${L(travelTimes, ([p, t]) => `  ${q(p)}: ${t}`)}
};

// Пункты встречи (Treffpunkt)
this.treffpunkt = {
${L(treffpunkt, coordLine)}
};

// Время в пути от пункта встречи до каждого участника
this.trefftravelTimes = {
${L(trefftravelTimes, ([p, t]) => `  ${q(p)}: ${t}`)}
};

// Приоритетные списки остановок и попутчики
this.participantOrders = {
${Object.keys(participantOrders).filter(k => !k.startsWith('_')).map(s => {
  const arr = (participantOrders[s] || []).map(item => {
    if (typeof item === 'string') return JSON.stringify(item);
    if (item?.treffpunkt) return JSON.stringify({ treffpunkt: item.treffpunkt, persons: item.persons || [] });
    return JSON.stringify({ main: item.main, subParticipants: item.subParticipants || [] });
  });
  const sp = startPassengers[s];
  if (sp && sp.length) {
    return `  ${q(s)}: {"startPassengers":${JSON.stringify(sp)},"order":[${arr.join(',')}]}`;
  }
  return `  ${q(s)}: [${arr.join(',')}]`;
}).join(',\n')}
};

// Прощание
const defaultFarewellData = ${JSON.stringify({ text: farewellList[0] || farewellText, list: farewellList }, null, 2)};

// Список приветствий
const defaultGreetingsData = ${JSON.stringify(defaultGreetings, null, 2)};

// Конечные точки
const defaultMachineDestinationsData = [
${defaultMachineDestinations.map(d => `  { name: ${q(d.name)}, lat: ${d.lat == null ? 'null' : fmtCoord(d.lat)}, lng: ${d.lng == null ? 'null' : fmtCoord(d.lng)} }`).join(',\n')}
];

// Служебный блок редактора: когда запись добавлена (c) и изменена (u).
// Главная страница его не читает — нужен только для сортировки «по дате».
const defaultEntryMetaData = ${JSON.stringify(metaOut, null, 2)};`;
}

async function uploadStationsViaServer(password) {
  const btn = document.getElementById('ghSendStationsBtn');
  btn.disabled = true;
  showMsg('Загрузка на GitHub…', 5000);
  try {
    const resp = await fetch(api('/api/upload-stations'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, content: buildExportText() }),
    });
    const d = await resp.json().catch(() => ({}));
    if (resp.ok && d.ok) {
      closeModal('ghModal');
      setStatus('ok', '✅ stations.js загружен на GitHub', '✅');
      showMsg('stations.js загружен ✅', 2500);

      showMsg('❌ Неверный пароль', 3500);      // модалку не закрываем — можно ввести заново

      closeModal('ghModal');

    showMsg('❌ Сервер недоступен: ' + e.message, 4000);
  } finally {
    btn.disabled = false;
  }
}

// ═══════════════════════════════════════
//  РАЗБОР КООРДИНАТ
//  Сначала пробуем локально (мгновенно и работает
//  офлайн), сервер — только для коротких ссылок.
// ═══════════════════════════════════════
const inRange = (lat, lng) => Math.abs(lat) <= 90 && Math.abs(lng) <= 180;

// Правила разбора ссылок. Порядок = приоритет.
// exact:false означает «это центр карты, а не сама точка» —
// такие координаты помечаются оранжевым и требуют проверки.
const URL_RULES = [
  { name: 'метка объекта (!3d!4d)', exact: true,  re: /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/ },
  { name: 'цель маршрута',          exact: true,  re: /[?&](?:daddr|destination)=(-?\d+(?:\.\d+)?)[,%]+(?:2C)?\s*(-?\d+(?:\.\d+)?)/i },
  { name: 'параметр q',             exact: true,  re: /[?&](?:q|query|dest)=(?:loc:)?(-?\d+\.\d+)[,%]+(?:2C)?\s*(-?\d+\.\d+)/i },
  { name: 'параметр ll',            exact: true,  re: /[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/ },
  { name: 'OSM-маркер',             exact: true,  re: /[?&]mlat=(-?\d+\.\d+)[^#]*?[?&]mlon=(-?\d+\.\d+)/ },
  { name: '/place/lat,lng',         exact: true,  re: /\/place\/(-?\d+\.\d+),(-?\d+\.\d+)/ },
  { name: 'geo:',                   exact: true,  re: /^geo:(-?\d+\.\d+),(-?\d+\.\d+)/i },
  { name: 'центр карты (@)',        exact: false, re: /@(-?\d+\.\d+),(-?\d+\.\d+)/ },
  { name: 'центр карты (center)',   exact: false, re: /[?&]center=(-?\d+\.\d+),(-?\d+\.\d+)/ },
  { name: 'центр карты OSM',        exact: false, re: /#map=\d+(?:\.\d+)?\/(-?\d+\.\d+)\/(-?\d+\.\d+)/ }
];

// Разбор ссылки на месте, без сервера
function parseCoordsFromUrl(raw) {
  const variants = [raw];
  try { variants.push(decodeURIComponent(raw)); } catch {}
  for (const rule of URL_RULES) {
    for (const v of variants) {
      const m = v.match(rule.re);
      if (m) {
        const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
        if (inRange(lat, lng)) return { lat, lng, source: rule.name, approx: !rule.exact };
      }
    }
  }
  return null;
}

// Разбор «просто чисел», немецких запятых и градусов
function parseCoordsFromText(raw) {
  const s = raw.trim();

  // Немецкий формат с запятой как разделителем дробной части: 51,530133, 6,850858
  // Проверяем ПЕРВЫМ: иначе «51,53» разобралось бы как два целых числа
  let m = s.match(/^([-+]?\d{1,3}),(\d+)\s*[;,]\s*([-+]?\d{1,3}),(\d+)$/);
  if (m) {
    const lat = parseFloat(`${m[1]}.${m[2]}`), lng = parseFloat(`${m[3]}.${m[4]}`);
    if (inRange(lat, lng)) return { lat, lng, source: 'формат DE' };
  }

  // 51.530133, 6.850858 / 51.530133 6.850858 / 51.530133;6.850858
  m = s.match(/^([-+]?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*([-+]?\d{1,3}(?:\.\d+)?)$/);
  if (m) {
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (inRange(lat, lng)) return { lat, lng, source: 'ручной ввод' };
  }

  // Градусы-минуты-секунды: 51°31'48.5"N 6°51'03.1"E
  const dms = [...s.matchAll(/(\d{1,3})°\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([NSEWNSOW])/gi)];
  if (dms.length === 2) {
    const toDec = mm => {
      let v = +mm[1] + +mm[2] / 60 + parseFloat(String(mm[3]).replace(',', '.')) / 3600;
      if (/[SW]/i.test(mm[4])) v = -v;
      return v;
    };
    const lat = toDec(dms[0]), lng = toDec(dms[1]);
    if (inRange(lat, lng)) return { lat, lng, source: 'градусы' };
  }
  return null;
}

// Единая точка входа. Возвращает {lat, lng, source, approx} или null
async function parseAnyCoords(input) {
  if (!input) return null;
  input = input.trim();

  // 1. Чистые координаты — мгновенно
  const asText = parseCoordsFromText(input);
  if (asText) return asText;

  const isUrl = /^(https?:\/\/|geo:)/i.test(input) || /(maps\.|goo\.gl|osm\.org|openstreetmap)/i.test(input);

  // 2. Длинная ссылка — почти всегда разбирается локально
  const fromUrl = isUrl ? parseCoordsFromUrl(input) : null;
  if (fromUrl && !fromUrl.approx) return fromUrl;

  if (!isUrl) { showMsg('❌ Не похоже на координаты или ссылку', 3000); return null; }

  // 3. Короткая ссылка (или в ссылке только центр карты) — идём на сервер,
  //    он раскроет редирект и найдёт точную метку объекта
  try {
    showMsg('🔄 Определяю координаты…', 6000);
    const resp = await fetch(api('/api/parse-coords?input=') + encodeURIComponent(input));
    const d = await resp.json().catch(() => ({}));
    if (resp.ok && d.success) return { lat: d.lat, lng: d.lng, source: d.source || 'сервер', approx: d.approx === true };
    if (fromUrl) { return fromUrl; }   // сервер не помог — берём хотя бы центр карты
    showMsg('❌ ' + (d.error || 'Координаты не распознаны'), 3000);
    return null;
  } catch (e) {
    if (fromUrl) return fromUrl;
    showMsg('❌ Сервер недоступен — введите координаты вручную (lat, lng)', 4000);
    return null;
  }
}

let isDirty = false;
function markDirty() {
  isDirty = true;
  document.getElementById('dirtyBadge').classList.add('visible');
}
function markClean() {
  isDirty = false;
  document.getElementById('dirtyBadge').classList.remove('visible');
}
window.addEventListener('beforeunload', e => {
  if (isDirty) { e.preventDefault(); e.returnValue = ''; }
});

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  searchClear.classList.toggle('visible', q.length > 0);
  filterCards(q);
  // Пока идёт фильтрация — перетаскивание запрещено (порядок был бы неверным)
  document.querySelectorAll('#cards [id$="List"]').forEach(l => {
    if (l._sortable) l._sortable.option('disabled', q.length > 0);
  });
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  render();
  searchInput.focus();
});

function filterCards(q) {
  document.querySelectorAll('#cards .card').forEach(card => {
    const hay = (card.textContent + ' ' + [...card.querySelectorAll('input')].map(i => i.value).join(' ')).toLowerCase();
    card.style.display = (!q || hay.includes(q)) ? '' : 'none';
  });
}
